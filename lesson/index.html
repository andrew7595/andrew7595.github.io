<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃柏瑞老師｜課程作業專區</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.6;
      color: #eaf0ff;
      background: #101827;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 38px);
    }

    header p {
      margin: 0;
      color: #b8c5dc;
    }

    /* 圖片隨所在區塊寬度縮放，並維持原始比例 */
    .responsive-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 24px auto;
      border-radius: 14px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .course-card {
      padding: 24px;
      border: 1px solid #34435d;
      border-radius: 16px;
      background: #1a263b;
    }

    .course-card h2 {
      margin: 0 0 20px;
      font-size: 21px;
      color: #ffffff;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .upload {
      color: #07242a;
      background: #67e8f9;
    }

    .upload:hover {
      background: #a5f3fc;
    }

    .download {
      color: #ffffff;
      background: #394e76;
    }

    .download:hover {
      background: #4b6392;
    }

    .button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 14px;
      color: #b8c5dc;
    }

    /* 手機改為單欄顯示 */
    @media (max-width: 640px) {
      .course-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 24px 16px;
      }

      .course-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

    <img

  </main>
</body>
</html>
